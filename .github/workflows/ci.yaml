name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build