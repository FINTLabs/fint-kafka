[versions]
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
ktlint-kotlin = "2.2.21"
logback = "1.5.34"
spring-boot = "3.5.16"
ben-manes-versions = "0.66.0"
jackson2 = "2.21.8"
jackson2-buildscript = "2.22.4"
log4j2 = "2.25.5"
netty = "4.1.137.Final"
lz4 = "1.12.1"
mockito-kotlin = "6.4.0"
httpclient5 = "5.6.5"
httpcore5 = "5.4.4"
commons-lang3 = "3.21.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson2-bom-buildscript = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2-buildscript" }
log4j-bom = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j2" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "ben-manes-versions" }
